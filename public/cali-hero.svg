<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Paisaje ilustrado de Cali al atardecer con montañas, ciudad, iglesia, gato y palmeras">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#512078"/><stop offset=".48" stop-color="#b53b91"/><stop offset=".78" stop-color="#ff9b70"/><stop offset="1" stop-color="#ffd16c"/></linearGradient>
 <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#315b66"/><stop offset="1" stop-color="#173d49"/></linearGradient>
 <linearGradient id="city" x2="0" y2="1"><stop stop-color="#ffd18c"/><stop offset="1" stop-color="#7a367a"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff5bd"/><stop offset="1" stop-color="#ffb36e" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
